name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-course:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install NumPy and CPU-only PyTorch
        run: |
          python -m pip install numpy==2.5.2
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps

      - name: Check setup and deterministic capstone
        run: python check_setup.py

      - name: Compile every tracked Python path
        run: |
          python - <<'PY'
          import py_compile
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "*.py"], text=True
          ).splitlines()
          if not paths:
              raise SystemExit("no tracked Python paths found")
          for path in paths:
              py_compile.compile(path, doraise=True)
          print(f"compiled tracked Python paths: {len(paths)}")
          PY

      - name: Run a nonempty test suite
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          print(f"discovered tests: {count}")
          if count == 0:
              raise SystemExit("test discovery found zero tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

      - name: Run every narrated example without warnings
        shell: bash
        run: |
          for example in examples/[0-9][0-9]_*.py; do
            echo "running ${example}"
            python -W error "${example}"
          done

      - name: Run the capstone twice
        shell: bash
        run: |
          python hands_on/train_tiny_transformer.py
          cp training-report.json first-training-report.json
          python hands_on/train_tiny_transformer.py
          cmp first-training-report.json training-report.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only
