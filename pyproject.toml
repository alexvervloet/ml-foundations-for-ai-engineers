[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-foundations-for-ai-engineers"
version = "0.1.0"
description = "Offline tensor and transformer foundations for AI engineers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Vervloet" }]
dependencies = [
  "numpy==2.5.0",
  "torch==2.12.1",
]

[tool.setuptools.packages.find]
include = ["ml_foundations*"]
